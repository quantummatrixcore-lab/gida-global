<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="100%">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Emblem Mark Group -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Frame -->
    <path d="M 60 10 C 95 10 110 20 110 45 C 110 85 60 115 60 118 C 60 118 10 85 10 45 C 10 20 25 10 60 10 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#logoShadow)"/>

    <!-- Globe Orbit Ring -->
    <ellipse cx="60" cy="62" rx="42" ry="18" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85" transform="rotate(-15 60 62)"/>

    <!-- Water Drop (Temizlik) -->
    <path d="M 52 32 C 52 32 36 54 36 68 C 36 78 44 86 54 86 C 64 86 72 78 72 68 C 72 54 56 32 56 32 Z" 
          fill="url(#azureGrad)" opacity="0.95"/>

    <!-- Food Leaf (Gıda) -->
    <path d="M 66 38 C 48 38 42 56 44 80 C 66 80 82 64 78 42 C 74 39 70 38 66 38 Z" 
          fill="url(#emeraldGrad)" opacity="0.95"/>

    <!-- Leaf Vein Highlight -->
    <path d="M 46 78 C 56 66 66 52 74 44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Gold Accent Star -->
    <circle cx="92" cy="30" r="4.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography Group -->
  <g transform="translate(145, 46)">
    <!-- GIDA -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="2" fill="#0F172A" class="logo-text-primary">GİDA</text>
    
    <!-- GLOBAL -->
    <text x="120" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="2.5" fill="#10B981">GLOBAL</text>
    
    <!-- Gold Dot -->
    <circle cx="282" cy="20" r="4.5" fill="#F59E0B"/>

    <!-- Subtitle Line -->
    <text x="2" y="56" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" letter-spacing="3.5" fill="#64748B" class="logo-text-sub">KÜRESEL TEMEL GİDA &amp; TEMİZLİK TEDARİKİ</text>
  </g>
</svg>