<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Container Group -->
  <g transform="translate(10, 15)">
    <!-- Shield / Badge Icon -->
    <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <rect x="9" y="9" width="82" height="82" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>

    <!-- Wheat / Globe Hybrid Icon -->
    <!-- Globe lines -->
    <circle cx="50" cy="50" r="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <ellipse cx="50" cy="50" rx="12" ry="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <line x1="24" y1="50" x2="76" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    
    <!-- Central Wheat Leaf motif -->
    <path d="M 50 25 C 40 38 42 58 50 72 C 58 58 60 38 50 25 Z" fill="url(#goldGrad)"/>
    <path d="M 50 35 C 32 45 35 60 50 70 C 65 60 68 45 50 35 Z" fill="url(#goldGrad)" opacity="0.7"/>
  </g>

  <!-- Brand Typography -->
  <text x="120" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="-1">GİDA</text>
  <text x="235" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" letter-spacing="-1">GLOBAL</text>

  <!-- Tagline / Subtitle -->
  <rect x="122" y="78" width="340" height="22" rx="4" fill="#0f172a"/>
  <text x="130" y="93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff" letter-spacing="2.5">TEMEL GIDA &amp; TEMİZLİK TOPTAN İHRACAT</text>
</svg>