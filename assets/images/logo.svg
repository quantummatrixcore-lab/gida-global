<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 130" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17" />
      <stop offset="50%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Crest Symbol -->
  <g transform="translate(15, 8)">
    <!-- Hexagonal Diamond Crest Outer -->
    <polygon points="55,5 100,28 100,78 55,102 10,78 10,28" 
             fill="url(#crestGrad)" stroke="url(#goldLuxury)" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Inner Golden Geometry -->
    <polygon points="55,12 92,32 92,74 55,95 18,74 18,32" 
             fill="none" stroke="url(#goldLuxury)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Clean Hygiene Water Droplet (Left) -->
    <path d="M 45 32 C 45 32 30 52 30 65 C 30 74 38 82 48 82 C 58 82 66 74 66 65 C 66 52 51 32 51 32 Z" 
          fill="url(#cyanLuxury)" opacity="0.92"/>

    <!-- Natural Food Wheat / Leaf (Right Interlocking) -->
    <path d="M 62 36 C 46 36 38 52 40 76 C 62 76 78 62 74 40 C 70 37 66 36 62 36 Z" 
          fill="url(#emeraldLuxury)" opacity="0.95"/>
    
    <!-- Central Leaf Spine -->
    <path d="M 42 74 C 52 62 62 48 70 42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Gold Center Pivot Core -->
    <circle cx="55" cy="55" r="4" fill="url(#goldLuxury)"/>
  </g>

  <!-- Wordmark Branding -->
  <g transform="translate(135, 42)">
    <!-- GIDA -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="36" letter-spacing="2.5" fill="#0F172A" class="brand-title-primary">GIDA</text>
    
    <!-- GLOBAL -->
    <text x="126" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="36" letter-spacing="3" fill="#10B981">GLOBAL</text>

    <!-- Luxury Gold Accent Separator -->
    <rect x="296" y="14" width="3" height="20" rx="1.5" fill="url(#goldLuxury)"/>

    <!-- EXPORT TAG -->
    <text x="312" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" letter-spacing="4" fill="#F59E0B">EXPORT</text>

    <!-- Subtitle -->
    <text x="2" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="4" fill="#64748B" class="brand-title-sub">KÜRESEL TEMEL GIDA VE TEMİZLİK TEDARİK AĞI</text>
  </g>
</svg>